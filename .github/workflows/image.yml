# Push to main: build the image and push it to GHCR. Jinx notices and redeploys (jinx/autodeploy.sh).
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mayurjivani/chorus:latest,ghcr.io/mayurjivani/chorus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
