# Push to main: build the image, push it to GHCR, tell Coolify to redeploy.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mayurjivani/chorus:latest,ghcr.io/mayurjivani/chorus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # COOLIFY_UUID (a repo variable) is the Coolify resource. forge.futile.studio sits
      # behind Cloudflare Access, so the call carries the CI service token too.
      - name: Redeploy
        if: vars.COOLIFY_UUID != ''
        env:
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          curl -fsS -H "Authorization: Bearer $TOKEN" -H "CF-Access-Client-Id: $CF_ID"
          -H "CF-Access-Client-Secret: $CF_SECRET"
          "https://forge.futile.studio/api/v1/deploy?uuid=${{ vars.COOLIFY_UUID }}"
