name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The server suite talks to a real PostgreSQL — the schema uses jsonb, partial-unique
    # indexes and window functions, so an in-memory stand-in wouldn't prove much.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chorusify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
        env:
          # Must end in `_test` — test/setup.ts refuses to run anywhere else, since the
          # integration tests truncate tables.
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/chorusify_test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy:
    # Only after the suite is green, and never from a pull request.
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH to Jinx
        env:
          JINX_SSH_KEY: ${{ secrets.JINX_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$JINX_SSH_KEY" > ~/.ssh/jinx
          chmod 600 ~/.ssh/jinx

          # Pinned rather than accepted on sight: StrictHostKeyChecking=no would
          # hand the deploy key to whatever answers on that hostname.
          echo 'ssh.futile.studio ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK2kX9HMU4eqmZ5nZH8kouxstbAJWfZtj52kAvCRqFmP' > ~/.ssh/known_hosts

          # ServerAlive* because a cold `docker compose --build` can run for
          # several minutes without writing anything to the channel.
          cat > ~/.ssh/config <<'EOF'
          Host ssh.futile.studio
              HostName ssh.futile.studio
              User icarusfalls
              ProxyCommand cloudflared access ssh --hostname %h
              IdentityFile ~/.ssh/jinx
              IdentitiesOnly yes
              IdentityAgent none
              ServerAliveInterval 30
              ServerAliveCountMax 120
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: sh deploy/deploy.sh
